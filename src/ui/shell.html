<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    :root {
      --bg-header: #1e1e24;
      --bg-tab-active: #282830;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-red: #ff0033;
      --tabbar-height: 40px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: var(--text-main);
      overflow: hidden;
      height: 40px;
    }

    /* Suppress window caption drag while dragging a tab so tab can glide freely across the titlebar */
    body.tab-dragging,
    body.tab-dragging * {
      -webkit-app-region: no-drag !important;
      cursor: grabbing !important;
    }

    /* Top Tab Bar */
    #tabbar {
      height: var(--tabbar-height);
      display: flex;
      align-items: stretch;
      background: var(--bg-header);
      padding: 0;
      -webkit-app-region: no-drag;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    /* Official YouTube Premium Brand on Top Left */
    #yt-brand {
      display: flex;
      align-items: center;
      padding: 0 10px 0 12px;
      height: 100%;
      cursor: pointer;
      -webkit-app-region: no-drag !important;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #yt-brand:hover {
      opacity: 0.85;
    }
    .yt-brand-icon {
      width: 101px;
      height: 20px;
      display: block;
    }

    /* Chrome-Style Navigation Controls (Back, Forward, Reload) */
    #nav-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 100%;
      -webkit-app-region: no-drag !important;
      flex-shrink: 0;
      padding-left: 2px;
    }
    .nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0 1px;
      -webkit-app-region: no-drag !important;
      transition: background 0.12s ease, color 0.12s ease, opacity 0.12s ease;
    }
    .nav-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      display: block;
    }
    .nav-btn:hover:not(:disabled):not(.disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .nav-btn:active:not(:disabled):not(.disabled) {
      background: rgba(255, 255, 255, 0.18);
    }
    .nav-btn:disabled,
    .nav-btn.disabled {
      opacity: 0.32;
      cursor: default;
    }

    /* Vertical Divider separating navigation from tabs */
    #nav-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.16);
      margin: 0 8px 0 6px;
      align-self: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag !important;
    }

    /* Tabs Container: holds tabs & + button with dynamic responsive flex sizing */
    #tabs-container {
      display: flex;
      align-items: stretch;
      height: 100%;
      -webkit-app-region: no-drag;
      flex: 0 1 auto;
      max-width: calc(100vw - 320px);
      min-width: 0;
      overflow: visible;
      position: relative;
    }

    #tabs-list {
      display: flex;
      align-items: stretch;
      gap: 2px;
      height: 100%;
      position: relative;
      flex: 0 1 auto;
      min-width: 0;
      overflow: visible;
    }

    /* Chrome-Style Tab Item: responsive width that shrinks equally as more tabs open */
    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      width: 200px;
      min-width: 36px;
      max-width: 220px;
      flex: 1 1 200px;
      padding: 0 8px 0 10px;
      border-radius: 8px 8px 0 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      position: relative;
      user-select: none;
      -webkit-app-region: no-drag !important;
      transition: background 0.12s ease, color 0.12s ease, flex-basis 0.16s ease;
      touch-action: none;
      overflow: hidden;
    }
    body.is-maximized .tab-item.active {
      border-radius: 0;
    }
    .tab-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e8eaed;
    }
    .tab-item.active {
      background: var(--bg-tab-active);
      color: #ffffff;
      font-weight: 500;
    }
    .tab-item.dragging {
      z-index: 1000 !important;
      opacity: 0.98;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      background: var(--bg-tab-active) !important;
      cursor: grabbing !important;
    }

    /* Chrome New Tab Expansion Animation */
    .tab-item.tab-entering {
      width: 0 !important;
      min-width: 0 !important;
      max-width: 0 !important;
      flex: 0 0 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
    }
    .tab-item.tab-animate {
      transition: width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  flex-basis 0.18s cubic-bezier(0.2, 0, 0, 1),
                  min-width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  max-width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  padding 0.18s cubic-bezier(0.2, 0, 0, 1),
                  margin 0.18s cubic-bezier(0.2, 0, 0, 1),
                  opacity 0.18s cubic-bezier(0.2, 0, 0, 1) !important;
    }

    /* Chrome Tab Closing Collapse Animation */
    .tab-item.tab-closing {
      width: 0 !important;
      min-width: 0 !important;
      max-width: 0 !important;
      flex: 0 0 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
      transition: width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  flex-basis 0.18s cubic-bezier(0.2, 0, 0, 1),
                  min-width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  max-width 0.18s cubic-bezier(0.2, 0, 0, 1),
                  padding 0.18s cubic-bezier(0.2, 0, 0, 1),
                  margin 0.18s cubic-bezier(0.2, 0, 0, 1),
                  opacity 0.14s ease !important;
    }

    /* Tab Separator (Chrome style 1px vertical line) */
    .tab-separator {
      position: absolute;
      right: 0;
      top: 12px;
      height: 16px;
      width: 1px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 1px;
      pointer-events: none;
      transition: opacity 0.12s;
    }
    /* Chrome rule: Hide separator if active, hovered, dragging, or if next tab is active/hovered */
    .tab-item.active .tab-separator,
    .tab-item:hover .tab-separator,
    .tab-item.dragging .tab-separator,
    .tab-item:has(+ .tab-item.active) .tab-separator,
    .tab-item:has(+ .tab-item:hover) .tab-separator,
    .tab-item:has(+ .tab-item.dragging) .tab-separator {
      opacity: 0 !important;
    }
    .tab-item:last-child .tab-separator {
      display: none;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
      pointer-events: none;
    }
    @keyframes tab-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tab-spinner {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      animation: tab-spin 0.8s linear infinite;
      display: none;
      pointer-events: none;
    }
    .tab-item.loading .tab-spinner {
      display: block;
    }
    .tab-item.loading .tab-favicon {
      display: none;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.2;
      min-width: 0;
    }
    .tab-audio-icon {
      display: none;
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      flex-shrink: 0;
      pointer-events: none;
    }
    .tab-item.audible .tab-audio-icon {
      display: block;
    }
    .tab-item.active .tab-audio-icon {
      fill: #ffffff;
    }

    /* Close Button (Chrome style with hover circle) */
    .tab-close-btn {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
      transition: background 0.12s, opacity 0.12s, color 0.12s;
      -webkit-app-region: no-drag !important;
    }
    .tab-item:hover .tab-close-btn {
      opacity: 0.8;
    }
    .tab-item.active .tab-close-btn {
      opacity: 0.85;
    }
    .tab-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      opacity: 1 !important;
    }
    .tab-close-btn svg {
      width: 9px;
      height: 9px;
      stroke: currentColor;
      pointer-events: none;
    }

    /* Chrome Compact Modes when many tabs are open */
    .tabs-compact .tab-item:not(.active):not(:hover) .tab-close-btn {
      display: none !important;
    }
    .tabs-tiny .tab-title {
      display: none !important;
    }
    .tabs-tiny .tab-item {
      padding: 0;
      justify-content: center;
    }
    .tabs-tiny .tab-item:not(:hover) .tab-close-btn {
      display: none !important;
    }

    /* Plus Button immediately adjacent to last tab */
    #new-tab-btn {
      width: 28px;
      height: 28px;
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag !important;
      transition: background 0.12s, color 0.12s;
    }
    #new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    #new-tab-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
    }

    /* Drag & Drop text search indicator: entire empty tab bar */
    body.is-dropping-text #tabbar,
    body.is-dropping-text #window-drag-region {
      -webkit-app-region: no-drag !important;
    }

    /* Window Drag Region (fills empty space between + button and controls) */
    #window-drag-region {
      flex: 1;
      height: 100%;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      position: relative;
      transition: background 0.15s ease;
      min-width: 60px;
      box-sizing: border-box;
      padding: 0 4px;
    }

    /* Tab drop hover target: highlights the tab cleanly when dragging directly onto it */
    .tab-item.drop-target {
      background: rgba(62, 166, 255, 0.22) !important;
      color: #ffffff !important;
      outline: 1.5px solid #3ea6ff;
      outline-offset: -1.5px;
    }

    /* Chrome-Style Tab Insertion Marker */
    #tab-drop-indicator {
      display: none;
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 2.5px;
      background: #3ea6ff;
      border-radius: 1.5px;
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(62, 166, 255, 0.85);
      transition: left 0.04s ease-out;
    }
    #tab-drop-indicator::before,
    #tab-drop-indicator::after {
      content: '';
      position: absolute;
      left: -3.5px;
      width: 9.5px;
      height: 5px;
      background: #3ea6ff;
    }
    #tab-drop-indicator::before {
      top: -1px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    #tab-drop-indicator::after {
      bottom: -1px;
      clip-path: polygon(50% 0, 0 100%, 100% 100%);
    }

    /* Window Controls */
    #window-controls {
      display: flex;
      align-items: center;
      margin-left: auto;
      height: 100%;
      -webkit-app-region: no-drag !important;
    }
    .win-btn {
      width: 46px;
      height: var(--tabbar-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      transition: background 0.1s, color 0.1s;
    }
    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .win-btn.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    .tool-icon-btn svg {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      transition: fill 0.15s;
    }
    .tool-icon-btn:hover svg {
      fill: #ffffff;
    }
    .tool-icon-btn.active svg {
      fill: var(--accent-red);
    }
  </style>
</head>
<body>

    <!-- Chrome-Style Navigation Controls (Back, Forward, Reload) -->
    <div id="nav-controls">
      <button class="nav-btn disabled" id="btn-back" title="Click to go back, right-click to see history (Alt+Left Arrow)" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <button class="nav-btn disabled" id="btn-forward" title="Click to go forward, right-click to see history (Alt+Right Arrow)" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="Reload this page (Ctrl+R)">

          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>

      </button>
      <div id="nav-divider"></div>
    </div>

    <!-- Tightly stacked tabs with + button adjacent -->
    <div id="tabs-container">
      <div id="tabs-list"></div>
      <button id="new-tab-btn" title="New Tab (Ctrl+T)">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M6 1.5V10.5M1.5 6H10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Draggable empty region with double-click maximize and full-width text drop search -->
    <div id="window-drag-region"></div>

    <div id="window-controls">
      <button class="win-btn tool-icon-btn" id="btn-pin" title="Always on Top (Ctrl+Shift+T)">
        <svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
      </button>
      <button class="win-btn" id="win-min" title="Minimize">─</button>
      <button class="win-btn" id="win-max" title="Maximize">▢</button>
      <button class="win-btn close" id="win-close" title="Close">✕</button>
    </div>

    <!-- Chrome-Style Tab Insertion Indicator Caret -->
    <div id="tab-drop-indicator"></div>
  </div>

  <script src="shell.js"></script>
</body>
