name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Standalone Windows Application
        run: npm run package

      - name: Compress Release Archive
        run: |
          Compress-Archive -Path "release\*win32-x64\*" -DestinationPath YT-Desktop-Windows-x64.zip -CompressionLevel Optimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: YT-Desktop-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
